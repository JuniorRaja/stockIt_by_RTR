services:
  # ============================================================
  # CPU-only version (default - runs without any profile flag)
  # Usage: docker-compose up -d --build
  # ============================================================
  stocron-by-rtr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocron-by-rtr
    ports:
      - "8501:8501"
    volumes:
      # Mount source code for development (changes reflect without rebuild)
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./3-download_models.py:/app/3-download_models.py
      - ./4-train_classifier.py:/app/4-train_classifier.py
      # Mount data directory for offline operation
      - ./data:/app/data
      # Mount config for easy editing (writable for ML setup)
      - ./config:/app/config
      # Persist downloaded ML models
      - ./models:/app/models
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================================
  # GPU-enabled version (NVIDIA CUDA)
  # Usage: docker-compose --profile gpu up -d --build
  # Requires: NVIDIA Container Toolkit installed
  # ============================================================
  stocron-by-rtr-gpu:
    build:
      context: .
      dockerfile: Dockerfile.gpu
    container_name: stocron-by-rtr-gpu
    profiles: ["gpu"]
    ports:
      - "8501:8501"
    volumes:
      # Mount source code for development (changes reflect without rebuild)
      - ./src:/app/src
      - ./app.py:/app/app.py
      - ./3-download_models.py:/app/3-download_models.py
      - ./4-train_classifier.py:/app/4-train_classifier.py
      # Mount data directory for offline operation
      - ./data:/app/data
      # Mount config for easy editing
      - ./config:/app/config
      # Persist downloaded ML models
      - ./models:/app/models
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
      # GPU environment variables
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
    restart: unless-stopped
    # GPU allocation
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
