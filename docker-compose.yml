services:
  stocron-by-rtr:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stocron-by-rtr
    ports:
      - "8501:8501"
    volumes:
      # IMPORTANT: Mount data directory for offline operation
      - ./data:/app/data
      # Mount config for easy editing (writable for ML setup)
      - ./config:/app/config
      # Persist downloaded ML models
      - ./models:/app/models
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    # Note: Network not needed if using pre-downloaded data
    # network_mode: "none"  # Uncomment for true offline mode
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:8501/_stcore/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

# Source - https://stackoverflow.com/a/70761193
# Posted by Ben Butterworth, modified by community. See post 'Timeline' for change history
# Retrieved 2026-02-01, License - CC BY-SA 4.0

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1 # alternatively, use `count: all` for all GPUs
              capabilities: [gpu]
