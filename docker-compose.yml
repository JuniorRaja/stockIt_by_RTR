version: '3.8'

services:
  indian-equity-intelligence:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indian-equity-intelligence
    ports:
      - "8501:8501"
    volumes:
      # Persist data between container restarts
      - ./data:/app/data
      # Mount config for easy editing (optional)
      - ./config:/app/config:ro
    environment:
      - STREAMLIT_SERVER_PORT=8501
      - STREAMLIT_SERVER_ADDRESS=0.0.0.0
      - STREAMLIT_BROWSER_GATHER_USAGE_STATS=false
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8501/_stcore/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional: Run setup script to download initial data
  setup:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: indian-equity-setup
    volumes:
      - ./data:/app/data
    command: ["python", "setup.py", "--subset", "30"]
    profiles:
      - setup
